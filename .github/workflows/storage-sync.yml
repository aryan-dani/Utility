name: Scheduled Storage Sync

on:
  schedule:
    # Daily: incremental Drive changes only (Spark-friendly).
    - cron: "0 0 * * *"
    # Weekly Sunday 03:00 UTC: full reconcile + prune.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve sync mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # schedule cron_0_3 = weekly full; otherwise incremental
            if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
              MODE=full
            else
              MODE=incremental
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Using sync mode: $MODE"

      - name: Sync Google Drive → Firestore
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            npm run sync-drive:full
          else
            npm run sync-drive
          fi
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Index changed resources for search/RAG
        run: npm run index-content
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Purge expired semantic cache
        run: node runtime/index.mjs purge-cache
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

      - name: Revalidate production cache tags
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_REVALIDATE_URL: ${{ secrets.VERCEL_REVALIDATE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$VERCEL_REVALIDATE_URL" ]; then
            echo "Skipping revalidation: CRON_SECRET or VERCEL_REVALIDATE_URL not configured."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_REVALIDATE_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
